[project]
name = "synthetic-data-pipeline"
version = "0.1.0"
description = "A self-instruct style generation pipeline whose real deliverable is the hygiene layer: MinHash dedup, n-gram decontamination, PII scrubbing, language ID."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
