[project]
name = "synthetic-data-pipeline"
version = "0.1.0"
description = "A self-instruct style generation pipeline whose real deliverable is the hygiene layer: MinHash dedup, n-gram decontamination, PII scrubbing, language ID."
requires-python = ">=3.11"
dependencies = [
    "datasketch>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.14.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
# Declared so `uv sync` can install the project itself. Without it the project
# is unbuildable, uv skips it, and the declared dependencies are never
# installed -- which passes locally where they happen to be present and fails
# on a clean CI runner.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_data_pipeline"]
