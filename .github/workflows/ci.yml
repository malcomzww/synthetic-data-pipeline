name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q

      # The portfolio's signature check: every number in the README is
      # generated, so a hand-edited result fails the build rather than
      # silently drifting from the code that produced it.
      #
      # generate_results.py also asserts every claim it prints and exits
      # non-zero if one breaks, so this step fails on a broken claim as
      # well as on a stale file.
      - name: Verify generated results are current
        run: |
          uv run python scripts/generate_results.py
          git diff --exit-code results/ \
            || (echo "results/ is stale -- regenerate and commit" && exit 1)
